name = "palantir-sync-worker"
main = "src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]

# 48x/dag — elk half uur, de klok rond, geen tijdvenster meer (bewust gekozen
# voor maximale actualiteit). Ruim binnen de gratis GA4/GSC-quota (±4% van
# het strengste dagquotum) en de gratis Cloudflare-requestlimiet. De sync
# zelf haalt elke run de laatste 3 dagen opnieuw op, dus laat aankomende
# GA4/GSC-data corrigeert zichzelf vanzelf op de eerstvolgende run.
[triggers]
crons = ["*/30 * * * *"]

# Secrets (set via `wrangler secret put <NAME>`, not committed here):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   SYNC_TRIGGER_SECRET  (shared secret for the manual/backfill fetch() trigger)
